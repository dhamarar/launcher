name: Build & Release Launcher APK

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-release-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK Size Gate
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "Release APK size: $((size / 1024)) KB ($size bytes)"
          test "$size" -lt 589824 || { echo "APK exceeds 576 KB size limit"; exit 1; }

      - name: Rename APK for Release
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk launcher/app/build/outputs/apk/release/tvhome-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-release-apk
          path: launcher/app/build/outputs/apk/release/tvhome-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CleanYourTV Launcher (Latest Build)"
          body: |
            ### CleanYourTV Launcher for Android TV
            - Personalized build with **On-Screen Customization**, **Reorder Button**, and **App Library** enabled.
            - Sideload `tvhome-release.apk` to your TV using your Android phone (*Send Files to TV* or *Bugjaeger*) or directly on TV via *Downloader*.
          files: |
            launcher/app/build/outputs/apk/release/tvhome-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
